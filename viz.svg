<circle cx="538.0" cy="144.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="538.0" y="149.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">2</text>
<circle cx="538.0" cy="252.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="538.0" y="257.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">3</text>
<circle cx="222.0" cy="252.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="222.0" y="257.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">4</text>
<line x1="24.0" y1="300.0" x2="736.0" y2="300.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="320.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="324.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="325.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Carry a map original→clone. Visiting a node: already in the map → return its clone</text>
<text x="56.0" y="344.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">(breaks the cycle); otherwise create the clone, REGISTER IT FIRST, then clone</text>
<text x="56.0" y="363.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">neighbors into it.</text>
<text x="72.0" y="398.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">map growth</text>
<rect x="84.0" y="379.0" width="144.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="156.0" y="398.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">1 → 1' created</text>
<rect x="238.0" y="379.0" width="144.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="310.0" y="398.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">2 → 2' created</text>
<rect x="392.0" y="379.0" width="144.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="464.0" y="398.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">3 → 3' created</text>
<rect x="84.0" y="415.0" width="333.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="250.5" y="434.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">4 → 4' → sees 1' in map, links back</text>
<line x1="24.0" y1="459.0" x2="736.0" y2="459.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="479.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="483.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="484.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Register-before-recursing is the entire difficulty: registering after would re-enter</text>
<text x="56.0" y="503.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">node 1 while cloning 4 and spin forever. The clone has identical shape, all-new</text>
<text x="56.0" y="522.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">nodes.</text>
